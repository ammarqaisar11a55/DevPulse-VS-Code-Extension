name: Release

# Pushing a version tag (for example v1.0.0) builds, tests and publishes the extension as a
# GitHub release with the packaged .vsix attached. The tag must match package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

      - name: Package the extension
        run: npm run package

      - name: Test the packaged extension in VS Code
        run: |
          npm run compile:integration
          xvfb-run -a npm run test:vsix

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > release-notes.md
          echo >> release-notes.md
          # This version's section of the changelog, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >> release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "devpulse-${VERSION}.vsix" \
            --title "DevPulse for VS Code ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
